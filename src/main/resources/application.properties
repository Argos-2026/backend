spring.application.name=argos_backend
spring.config.import=optional:file:./.env[.properties]

argos.openai-api-key=${OPENAI_API_KEY:}
argos.openai-model=${OPENAI_MODEL:gpt-5.4-mini}
argos.naver-client-id=${NAVER_CLIENT_ID:}
argos.naver-client-secret=${NAVER_CLIENT_SECRET:}
argos.brave-api-key=${BRAVE_API_KEY:}
argos.workers=${ANALYSIS_WORKERS:2}
argos.queue-capacity=${ANALYSIS_QUEUE_CAPACITY:8}
argos.max-jobs=${ANALYSIS_MAX_JOBS:100}
argos.job-timeout=${ANALYSIS_TIMEOUT:10m}
argos.retention=24h
argos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false

springdoc.paths-to-match=/api/v1/analyses,/api/v1/analyses/**,/api/v1/demo/analyses,/api/v1/demo/analyses/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
