name: Argos Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argos-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/argos-2026/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Argos-2026/backend
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Deploy backend only via SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"
          image="ghcr.io/argos-2026/backend:${DEPLOY_SHA}"
          encoded="$(base64 -w 0 scripts/deploy-ec2.sh)"
          command="printf '%s' '${encoded}' | base64 -d | sudo -H -u ec2-user bash -s -- '${image}'"
          jq -n --arg cmd "$command" '{commands: [$cmd], executionTimeout: ["600"]}' > /tmp/argos-ssm.json

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Argos backend ${DEPLOY_SHA}" \
            --parameters file:///tmp/argos-ssm.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)"
          echo "SSM command ID: $command_id"

          status="Pending"
          for attempt in {1..90}; do
            sleep 5
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true
          test "$status" = "Success"
